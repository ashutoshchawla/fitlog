<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitLog">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>FitLog</title>
<style>
:root{--bg:#f4f6f6;--card:#fff;--ink:#14201f;--mute:#5d6b6a;--line:#dfe6e5;--acc:#0f766e;--acc2:#e08a1e;--bad:#b42318;--c1:#0f766e;--c2:#e08a1e;--c3:#6d5bd0;--band:rgba(15,118,110,.14);--sheet:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17201f;--ink:#e8f0ef;--mute:#93a5a3;--line:#263231;--acc:#2dd4bf;--acc2:#f2a444;--bad:#f97066;--c1:#2dd4bf;--c2:#f2a444;--c3:#a99cff;--band:rgba(45,212,191,.16);--sheet:#17201f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 16px 8px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:22px;margin:0}
header small{color:var(--mute);display:block;font-size:13px}
main{padding:4px 14px 20px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card h2{font-size:15px;margin:0 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;gap:10px;align-items:center}.row>*{flex:1}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{font-size:28px;font-weight:700}.mute{color:var(--mute)}.sm{font-size:13px}
.up{color:var(--bad)}.down{color:var(--acc)}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--acc);color:#fff;font-weight:600}
button.sec{background:transparent;color:var(--acc);border:1px solid var(--line)}
button.ghost{background:transparent;color:var(--mute);padding:6px 8px;font-weight:500}
button.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
button.full{width:100%}
button:active{opacity:.8}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
label.f{display:block;margin:0 0 10px;font-size:13px;color:var(--mute)}
label.f>input,label.f>select,label.f>textarea{margin-top:4px;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px;background:var(--card);color:var(--ink)}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.chip input{display:none}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:transparent;color:var(--mute);font-size:11px;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:500}
nav button span{font-size:20px}
nav button.on{color:var(--acc)}
.list>div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list>div:first-child{border-top:0}
.list .t{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--band);color:var(--acc);font-weight:600}
.empty{color:var(--mute);text-align:center;padding:18px 6px;font-size:14px}
.week{display:flex;gap:6px}.week div{flex:1;text-align:center;font-size:12px;color:var(--mute)}
.week i{display:block;width:100%;aspect-ratio:1;border-radius:8px;border:1px solid var(--line);margin-top:4px;line-height:30px;font-style:normal;font-size:14px}
.week i.plan{border-style:dashed}.week i.done{background:var(--acc);color:#fff;border-color:var(--acc)}.week i.today{outline:2px solid var(--acc2)}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}.chart .ax{fill:var(--mute);font-size:10px}
.chart .band{fill:var(--band)}.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round}
.chart .c1{stroke:var(--c1);fill:var(--c1)}.chart .c2{stroke:var(--c2);fill:var(--c2)}.chart .c3{stroke:var(--c3);fill:var(--c3)}
.chart .ln{fill:none}.chart .bar{fill:var(--c1)}.chart .tgt{stroke:var(--c2);stroke-dasharray:4 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);margin-top:4px}.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 12px;font-size:18px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#14201f;color:#fff;padding:10px 16px;border-radius:999px;z-index:30;font-size:14px;max-width:90%}
.banner{background:var(--band);border:1px solid var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:14px}
.ex{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 28px;gap:6px;margin-bottom:6px}.ex input{padding:8px}
.est td,.est th{padding:4px 3px;font-size:13px;text-align:left;vertical-align:middle}.est input{padding:6px;width:62px}
.est{width:100%;border-collapse:collapse}
.hint{font-size:13px;color:var(--mute);margin:4px 0 10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
a{color:var(--acc)}
</style>
</head>
<body>
<header><div><h1 id="h-title">FitLog</h1><small id="h-sub"></small></div><button class="ghost" data-a="settings" aria-label="Settings" style="font-size:22px">⚙️</button></header>
<main id="app"></main>
<nav id="nav"></nav>
<div id="layer"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $=s=>document.querySelector(s);
const KEY='fitlog.v1';
const pad2=n=>String(n).padStart(2,'0');
const fmtDate=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const todayStr=()=>fmtDate(new Date());
const parseDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const addDays=(s,n)=>{const d=parseDate(s);d.setDate(d.getDate()+n);return fmtDate(d);};
const dnum=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)/864e5;};
const dstr=n=>new Date(n*864e5).toISOString().slice(0,10);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const lbl=n=>{const d=new Date(n*864e5);return MON[d.getUTCMonth()]+' '+d.getUTCDate();};
const dow=s=>(parseDate(s).getDay()+6)%7; // Mon=0
const dayLabel=s=>{const t=todayStr();if(s===t)return'Today';if(s===addDays(t,-1))return'Yesterday';const d=parseDate(s);return DOW[dow(s)]+', '+MON[d.getMonth()]+' '+d.getDate();};
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r1=n=>Math.round(n*10)/10;
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?null:n;};
const avg=a=>a.reduce((x,y)=>x+y,0)/a.length;
const sum=a=>a.reduce((x,y)=>x+y,0);

/* ============ state ============ */
const blank=()=>({v:1,profile:null,body:[],workouts:[],meals:[],favs:[],foods:[],ai:{url:'',model:'',key:''},lastExport:null,created:todayStr()});
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(blank(),JSON.parse(r));}catch(e){}return blank();}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){toast('Could not save – storage blocked or full');}}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2400);}

/* ============ units ============ */
const metric=()=>(S.profile&&S.profile.units)!=='imperial';
const wU=()=>metric()?'kg':'lb', lU=()=>metric()?'cm':'in';
const wOut=kg=>metric()?kg:kg*2.20462, wIn=v=>metric()?v:v/2.20462;
const lOut=cm=>metric()?cm:cm/2.54, lIn=v=>metric()?v:v*2.54;

/* ============ goal + measurement knowledge ============ */
const MEAS={
 waist:{label:'Waist',how:'At the navel, relaxed, at the end of a normal breath out. Don’t suck in.'},
 hips:{label:'Hips',how:'Around the widest part of the hips/glutes, feet together.'},
 chest:{label:'Chest',how:'Across the nipple line, arms relaxed, after a normal breath out.'},
 shoulders:{label:'Shoulders',how:'Around the widest point of the shoulders, arms relaxed.'},
 biceps:{label:'Biceps',how:'Mid upper arm, relaxed (hanging). Same arm every time.'},
 forearm:{label:'Forearm',how:'Widest part, arm relaxed.'},
 thigh:{label:'Thigh',how:'Mid-thigh, standing, weight evenly spread. Same leg each time.'},
 calf:{label:'Calf',how:'Widest part of the calf, standing.'},
 neck:{label:'Neck',how:'Just below the Adam’s apple / voice box, snug not tight.'}
};
const GOALS={
 fat_loss:{label:'Lose fat',meas:['waist','hips','thigh','neck'],why:'Waist and hips shrink first as fat drops, even when the scale stalls.'},
 muscle_gain:{label:'Build muscle',meas:['chest','shoulders','biceps','thigh','waist','calf'],why:'Track the muscles you train, and keep the waist roughly steady to confirm the gain is lean.'},
 recomp:{label:'Lose fat and build muscle',meas:['waist','hips','chest','biceps','thigh'],why:'Waist down while chest, arms and thighs hold or rise is the recomposition signature.'},
 health:{label:'General health',meas:['waist','hips','neck'],why:'Waist (and waist-to-height ratio under 0.5) is the most useful health marker besides weight.'},
 strength:{label:'Strength / performance',meas:['chest','shoulders','thigh','waist','biceps'],why:'Lifts matter most; size measurements are a secondary check.'}
};
const ACT={sedentary:'Mostly sitting',light:'Lightly active',moderate:'Moderately active',high:'Very active'};
const EQUIP={gym:'Full gym',home:'Home weights / bands',body:'Bodyweight only',mixed:'Mix of these'};
const SLOTS=['Breakfast','Lunch','Dinner','Snack'];

/* ============ food estimator: local database + optional local LLM ============ */
const STOP=new Set('had ate eat eating i some for my the a an of today this morning afternoon evening lunch dinner breakfast brunch snack supper was also bit little about just then got took have another on in at after before around like small medium large big plate bowl cup cups piece pieces slice slices glass handful handfuls with and plus from made homemade home leftover left over raw all commercial varieties variety includes prepared'.split(' '));
const NUMW={a:1,an:1,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,couple:2,few:3,half:.5,quarter:.25};
const rx=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
const stem=w=>w.length>4&&/ies$/.test(w)?w.slice(0,-3)+'y':(w.length>3&&/(ses|xes|hes)$/.test(w)?w.slice(0,-2):(w.length>3&&/s$/.test(w)&&!/ss$/.test(w)?w.slice(0,-1):w));
const MODS=new Set(['oil','chip','fried','dried','powder','juice','syrup','sauce','canned','candy','bar','drink','snack','soup','pie','cake','flour','seed','extract','concentrate','frozen','dessert','smoothie','shake','spread','leave','leaf']);
const tokens=s=>s.toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(w=>w.length>2&&!STOP.has(w)).map(stem);
const r2=n=>Math.round(n*100)/100;

let FDB=null,FDBstate='idle';
async function foodDB(){
  if(FDB)return FDB;
  try{
    const r=await fetch('foods.json');if(!r.ok)throw 0;
    const j=await r.json();
    FDB={curated:j.curated||[],db:j.db||[],tok:(j.db||[]).map(x=>tokens(x[0]))};FDBstate='ok';
  }catch(e){FDB={curated:[],db:[],tok:[]};FDBstate='missing';}
  return FDB;
}
const userFoods=()=>(S.foods||[]).map(f=>({n:f.name,a:[f.name.toLowerCase()],p:f.p,c:f.c,s:'serving',g:f.g||100}));

function tokNum(t){if(t==null)return null;if(NUMW[t]!=null)return NUMW[t];if(/^\d+\/\d+$/.test(t)){const[a,b]=t.split('/').map(Number);return a/b;}const n=parseFloat(t);return isNaN(n)?null:n;}
/* grams the text asks for, or null if it only gives a count */
function gramsIn(seg){
  const m=seg.match(/(\d+(?:\.\d+)?|\d\/\d|half|quarter|an?|one|two|three|four|five|six|seven|eight|nine|ten)\s*(?:of\s+)?(?:an?\s+)?(cups?|scoops?|tbsp|tablespoons?|tsp|teaspoons?|g|gm|grams?|kg|ml|oz|ounces?)\b/);
  if(!m)return null;
  const q=tokNum(m[1]);if(q==null)return null;
  const u=m[2].replace(/s$/,'');
  const G={cup:240,scoop:30,tbsp:15,tablespoon:15,tsp:5,teaspoon:5,g:1,gm:1,gram:1,kg:1000,ml:1,oz:28,ounce:28};
  return G[u]?q*G[u]:null;
}
function countIn(seg){
  const m=seg.match(/(?:^|\s)(\d+(?:\.\d+)?|\d\/\d|one|two|three|four|five|six|seven|eight|nine|ten|couple|few|half|quarter)(?![\w.])(?!\s*(?:ml|g|gm|grams?|kg|oz|ounces?|lb|min|cm|%|cups?|scoops?|tbsp|tsp|tablespoons?|teaspoons?)\b)/);
  if(!m)return null;const q=tokNum(m[1]);return (q>0&&q<=40)?q:null;
}
function matchCurated(seg,list){
  let best=null,bl=0;
  for(const it of list)for(const a of it.a){
    if(a.length>=bl&&new RegExp('\\b'+rx(a)+'(?:s|es)?\\b').test(seg)){best=it;bl=a.length;}
  }
  return best;
}
function matchDB(seg,F){
  const st=tokens(seg);if(!st.length)return null;
  let best=null,bs=0;
  for(let i=0;i<F.tok.length;i++){
    const dt=F.tok[i];if(!dt.length)continue;
    let m=0;for(const t of dt)if(st.indexOf(t)>=0)m++;
    if(!m)continue;
    let sc=0.6*(m/dt.length)+0.4*(m/st.length)-(dt.length-m)*0.07;
    for(const t of dt)if(MODS.has(t)&&st.indexOf(t)<0){sc-=0.3;break;}
    if(sc>bs){bs=sc;best=F.db[i];}
  }
  return bs>=0.6?best:null;
}
function slotOf(s,def){if(/breakfast|brunch|morning/.test(s))return'Breakfast';if(/lunch|noon/.test(s))return'Lunch';if(/dinner|supper/.test(s))return'Dinner';if(/snack|evening|tea time/.test(s))return'Snack';return def;}
const SEGSPLIT=/,|\bwith\b|\band\b|\bplus\b|\+|\bthen\b|\balso\b|\bfollowed by\b/;

async function parseLocal(text,defSlot){
  const F=await foodDB(),cur=userFoods().concat(F.curated);
  const rows=[],unmatched=[];
  for(const sent of text.toLowerCase().split(/[.\n;]+/).map(s=>s.trim()).filter(Boolean)){
    const slot=slotOf(sent,defSlot);
    for(const seg of sent.split(SEGSPLIT).map(s=>s.trim()).filter(s=>s.length>1)){
      const c=matchCurated(seg,cur);
      if(c){
        const g=gramsIn(seg),n=countIn(seg);
        const mult=g!=null&&c.g?g/c.g:(n!=null?n:1);
        rows.push({seg,name:c.n,qty:(g!=null&&c.g)?Math.round(g)+' g':(mult===1?'1 '+(c.s||'serving'):r2(mult)+' × '+(c.s||'serving')),p:Math.round(c.p*mult),c:Math.round(c.c*mult),slot});
        continue;
      }
      const d=matchDB(seg,F);
      if(d){
        const g=gramsIn(seg)||100,m=g/100;
        rows.push({seg,name:d[0],qty:Math.round(g)+' g',p:Math.round(d[2]*m),c:Math.round(d[1]*m),slot});
        continue;
      }
      if(tokens(seg).length)unmatched.push(seg);
    }
  }
  return{rows,unmatched,engine:FDBstate==='ok'?'database':'built-in list'};
}

/* ---- optional local LLM (any OpenAI-compatible endpoint: Ollama, LM Studio, llama.cpp server) ---- */
const AI_SYSTEM=`You convert a meal description into structured data.
Reply with ONLY a JSON array, no prose, no markdown fences.
Each element: {"food":"short generic name","grams":number,"meal":"Breakfast|Lunch|Dinner|Snack","protein_g":number,"kcal":number}
Rules:
- One element per distinct food. Split dishes only if eaten separately.
- grams = your best estimate of the total amount eaten.
- Use the meal named in the text; if none is named use "`;
async function parseAI(text,defSlot){
  const a=S.ai||{};if(!a.url)return null;
  const url=a.url.replace(/\/+$/,'')+'/chat/completions';
  const ctrl=new AbortController(),to=setTimeout(()=>ctrl.abort(),a.timeout||90000);
  try{
    const r=await fetch(url,{method:'POST',signal:ctrl.signal,
      headers:Object.assign({'Content-Type':'application/json'},a.key?{Authorization:'Bearer '+a.key}:{}),
      body:JSON.stringify({model:a.model||'llama3.2:1b',temperature:0,stream:false,
        messages:[{role:'system',content:AI_SYSTEM+defSlot+'".'},{role:'user',content:text}]})});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    const txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||j.response||'';
    const m=txt.match(/\[[\s\S]*\]/);if(!m)throw new Error('model did not return JSON');
    const items=JSON.parse(m[0]);if(!Array.isArray(items)||!items.length)throw new Error('empty result');
    const F=await foodDB(),cur=userFoods().concat(F.curated),rows=[];
    for(const it of items){
      const nm=String(it.food||'').trim();if(!nm)continue;
      const g=Number(it.grams)>0?Number(it.grams):null;
      const slot=SLOTS.indexOf(it.meal)>=0?it.meal:defSlot;
      let p=Number(it.protein_g),c=Number(it.kcal),src=nm;
      const cm=matchCurated(nm.toLowerCase(),cur);
      const dm=cm?null:matchDB(nm.toLowerCase(),F);
      if(cm&&cm.g){const mult=(g||cm.g)/cm.g;p=Math.round(cm.p*mult);c=Math.round(cm.c*mult);src=cm.n;}
      else if(dm){const mult=(g||100)/100;p=Math.round(dm[2]*mult);c=Math.round(dm[1]*mult);src=dm[0];}
      if(!isFinite(p))p=0;if(!isFinite(c))c=0;
      rows.push({seg:nm,name:src,qty:g?Math.round(g)+' g':'1 serving',p:Math.round(p),c:Math.round(c),slot});
    }
    if(!rows.length)throw new Error('nothing recognised');
    return{rows,unmatched:[],engine:'local LLM ('+(a.model||'model')+')'};
  }finally{clearTimeout(to);}
}
async function parseMeals(text,defSlot){
  if(S.ai&&S.ai.url){
    try{const r=await parseAI(text,defSlot);if(r)return r;}
    catch(e){const r=await parseLocal(text,defSlot);r.aiError=(e&&e.message)||'unreachable';return r;}
  }
  return parseLocal(text,defSlot);
}

/* ============ analysis helpers ============ */
const bodySorted=()=>S.body.slice().sort((a,b)=>a.date<b.date?-1:1);
const weights=()=>bodySorted().filter(b=>b.kg!=null);
function slope(pts){if(pts.length<3)return null;const mx=avg(pts.map(p=>p[0])),my=avg(pts.map(p=>p[1]));let n=0,d=0;pts.forEach(p=>{n+=(p[0]-mx)*(p[1]-my);d+=(p[0]-mx)**2;});return d?n/d:null;}
function weeklyRate(days=21){const w=weights();if(!w.length)return null;const last=dnum(w[w.length-1].date);const pts=w.filter(b=>dnum(b.date)>=last-days).map(b=>[dnum(b.date),b.kg]);if(pts.length<3||pts[pts.length-1][0]-pts[0][0]<7)return null;const s=slope(pts);return s==null?null:s*7;}
function movAvg(w,win=7){return w.map(b=>{const t=dnum(b.date);const near=w.filter(x=>{const d=dnum(x.date);return d<=t&&d>t-win;});return[t,avg(near.map(x=>x.kg))];});}
function refRange(){const h=S.profile&&S.profile.heightCm;if(!h)return null;const m=h/100;return[18.5*m*m,24.9*m*m];}
function proteinTarget(){if(S.profile&&S.profile.proteinTarget)return S.profile.proteinTarget;const w=weights();if(!w.length)return null;return Math.round(1.6*w[w.length-1].kg/5)*5;}
function lastMeasure(key){const b=bodySorted().filter(x=>x.m&&x.m[key]!=null);return b.length?b[b.length-1]:null;}
function dayTotals(date){const m=S.meals.filter(x=>x.date===date);return{p:sum(m.map(x=>x.p||0)),c:sum(m.map(x=>x.c||0)),n:m.length};}
function burned(date){return sum(S.workouts.filter(w=>w.date===date).map(w=>w.kcal||0));}
const trained=date=>S.workouts.some(w=>w.date===date&&w.kind!=='rest');

/* ============ charts (dependency-free SVG) ============ */
function niceTicks(lo,hi,n){if(lo===hi){lo-=1;hi+=1;}const span=hi-lo,s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nm=s0/mag;const step=(nm<1.5?1:nm<3?2:nm<7?5:10)*mag;const a=Math.floor(lo/step)*step,b=Math.ceil(hi/step)*step,t=[];for(let v=a;v<=b+step/2;v+=step)t.push(+v.toFixed(6));return t;}
const fmtTick=t=>Math.abs(t)>=100?Math.round(t):r1(t);
function lineChart(o){
  const W=360,H=o.h||190,L=38,R=12,T=10,B=24;
  const pts=o.series.flatMap(s=>s.pts);if(!pts.length)return'<div class="empty">No data yet</div>';
  let x0=Math.min(...pts.map(p=>p[0])),x1=Math.max(...pts.map(p=>p[0]));if(x1-x0<6)x1=x0+6;
  let lo=Math.min(...pts.map(p=>p[1])),hi=Math.max(...pts.map(p=>p[1]));
  if(o.band){lo=Math.min(lo,o.band[0]);hi=Math.max(hi,o.band[1]);}
  const pd=Math.max((hi-lo)*.1,Math.abs(hi)*.01,.5);lo-=pd;hi+=pd;const ticks=niceTicks(lo,hi,4);lo=ticks[0];hi=ticks[ticks.length-1];
  const X=v=>L+(v-x0)/(x1-x0)*(W-L-R),Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
  let g='';
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="ax" x="${L-5}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${fmtTick(t)}</text>`;});
  if(o.band)g+=`<rect class="band" x="${L}" width="${W-L-R}" y="${Y(o.band[1]).toFixed(1)}" height="${(Y(o.band[0])-Y(o.band[1])).toFixed(1)}"/>`;
  [0,1/3,2/3,1].forEach(f=>{const t=Math.round(x0+f*(x1-x0));g+=`<text class="ax" x="${X(t).toFixed(1)}" y="${H-6}" text-anchor="middle">${lbl(t)}</text>`;});
  o.series.forEach(s=>{
    const d=s.pts.map((p,j)=>(j?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
    if(s.pts.length>1)g+=`<path d="${d}" class="ln c${s.c||1}" ${s.dash?'stroke-dasharray="5 4"':''}/>`;
    if(s.dots)s.pts.forEach(p=>{g+=`<circle cx="${X(p[0]).toFixed(1)}" cy="${Y(p[1]).toFixed(1)}" r="${s.pts.length>40?2:3}" class="c${s.c||1}"><title>${lbl(p[0])}: ${r1(p[1])}</title></circle>`;});
  });
  return`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}
function barChart(o){
  const W=360,H=o.h||150,L=34,R=8,T=10,B=22,n=o.bars.length;if(!n)return'<div class="empty">No data yet</div>';
  const mx=Math.max(...o.bars.map(b=>b.v),o.target||0,1)*1.1,ticks=niceTicks(0,mx,3),hi=ticks[ticks.length-1];
  const Y=v=>T+(1-v/hi)*(H-T-B),bw=(W-L-R)/n;let g='';
  ticks.forEach(t=>{g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}"/><text class="ax" x="${L-5}" y="${(Y(t)+3).toFixed(1)}" text-anchor="end">${fmtTick(t)}</text>`;});
  const every=Math.ceil(n/7);
  o.bars.forEach((b,i)=>{const x=L+i*bw+bw*.15,h=(H-B)-Y(b.v);g+=`<rect class="bar" x="${x.toFixed(1)}" y="${Y(b.v).toFixed(1)}" width="${(bw*.7).toFixed(1)}" height="${Math.max(h,0).toFixed(1)}" rx="2"><title>${esc(b.label)}: ${Math.round(b.v)}</title></rect>`;if(i%every===0)g+=`<text class="ax" x="${(x+bw*.35).toFixed(1)}" y="${H-6}" text-anchor="middle">${esc(b.label)}</text>`;});
  if(o.target)g+=`<line class="tgt" stroke-width="1.5" x1="${L}" x2="${W-R}" y1="${Y(o.target).toFixed(1)}" y2="${Y(o.target).toFixed(1)}"/>`;
  return`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img">${g}</svg>`;
}

function readProfile(old){
  const units=$('#p-units').value,h=num($('#p-h').value);

    name:$('#p-name').value.trim(),goal:$('#p-goal').value,units,age:num($('#p-age').value),

/* ============ TODAY ============ */

  const wk=addDays(t,-dow(t));
  const planToday=S.profile.schedule&&S.profile.schedule[dow(t)];
  const daysSince=S.lastExport?dnum(t)-dnum(S.lastExport.slice(0,10)):null;
  const banner=(S.body.length+S.workouts.length+S.meals.length>5&&(daysSince==null||daysSince>14))?`<div class="banner">Back up your data (it only lives on this phone). <button class="ghost" data-a="exportData" style="color:var(--acc);font-weight:700">Back up now</button></div>`:'';
  return banner+`
  <div class="card"><h2>${planToday?'Planned: training day':'Planned: rest day'}</h2>
   <div class="week">${DOW.map((d,i)=>{const dt=addDays(wk,i),done=trained(dt),plan=S.profile.schedule&&S.profile.schedule[i];return`<div>${d}<i class="${done?'done':plan?'plan':''} ${dt===t?'today':''}">${done?'✓':''}</i></div>`;}).join('')}</div>

  return`<div class="card"><h2>This week</h2><div class="row"><div><span class="big">${week.length}</span><div class="sm mute">sessions${(S.profile.schedule&&S.profile.schedule.filter(Boolean).length)?` of ${S.profile.schedule.filter(Boolean).length} planned`:''}</div></div>

async function runEstimate(){
  const text=$('#m-text').value.trim();if(!text){toast('Describe the meal first');return;}
  const box=$('#est');if(!box)return;
  box.innerHTML='<div class="hint">Working…</div>';
  let res;
  try{res=await parseMeals(text,$('#m-slot').value);}
  catch(e){box.innerHTML='<div class="hint">Could not estimate: '+esc((e&&e.message)||'error')+'</div>';return;}
  estRows=res.rows;
  const slots=[...new Set(res.rows.map(r=>r.slot))];
  let h='';
  if(res.rows.length)h+=`<table class="est"><tr><th>Food</th><th>Amount</th><th>P g</th><th>kcal</th></tr>${res.rows.map((r,i)=>`<tr><td>${esc(r.name)}${slots.length>1?` <span class="pill">${r.slot}</span>`:''}</td><td class="sm mute">${esc(r.qty)}</td><td><input class="e-p" data-i="${i}" inputmode="decimal" value="${r.p}"></td><td><input class="e-c" data-i="${i}" inputmode="numeric" value="${r.c}"></td></tr>`).join('')}</table>`;
  if(res.unmatched.length)h+=`<div class="hint">Not recognised: <b>${res.unmatched.map(esc).join('</b>, <b>')}</b>. Type the protein in yourself, or <a href="#" data-a="addFood" data-n="${esc(res.unmatched[0])}">teach the app this food</a>.</div>`;
  if(slots.length>1)h+='<div class="hint">Several meals detected – Save will split them.</div>';
  h+=`<div class="hint">Estimated by: ${esc(res.engine)}${res.aiError?` — local LLM unreachable (${esc(res.aiError)}), used the database instead`:''}</div>`;
  box.innerHTML=h||'<div class="hint">Nothing recognised. Enter protein manually below.</div>';
  syncEst();
}
function syncEst(){
  document.querySelectorAll('.e-p').forEach(i=>{estRows[i.dataset.i].p=num(i.value)||0;});document.querySelectorAll('.e-c').forEach(i=>{estRows[i.dataset.i].c=num(i.value)||0;});
  if(estRows.length){$('#m-p').value=Math.round(sum(estRows.map(r=>r.p)));if($('#m-c'))$('#m-c').value=Math.round(sum(estRows.map(r=>r.c)));}
}
function saveMeal(){
  const date=$('#m-date').value||todayStr(),slot=$('#m-slot').value,text=$('#m-text').value.trim();
  const p=num($('#m-p').value),c=$('#m-c')?num($('#m-c').value):null;
  const groups={};estRows.forEach(r=>{(groups[r.slot]=groups[r.slot]||[]).push(r);});
  if(Object.keys(groups).length>1){
    Object.entries(groups).forEach(([s,rs])=>S.meals.push({id:uid(),date,slot:s,text:rs.map(r=>r.seg).join(', '),p:Math.round(sum(rs.map(r=>r.p))),c:Math.round(sum(rs.map(r=>r.c)))||null}));
  }else{
    if(!text&&p==null&&c==null){toast('Add a description or numbers');return;}
    S.meals.push({id:uid(),date,slot,text,p:p!=null?p:null,c:c||null,pending:p==null});
    if($('#m-fav').checked&&text)S.favs.push({id:uid(),name:text.slice(0,40),text,p:p||0,c:c||0,slot});
  }
  mealDate=date;save();closeSheet();render();toast('Meal saved');
}

function vProgress(){
  const t=todayStr(),lim=chartRange>0?dnum(t)-chartRange:-1e9;
  const w=weights().filter(x=>dnum(x.date)>=lim);
  // weekly minutes
  const weeks={};S.workouts.filter(x=>x.kind!=='rest'&&dnum(x.date)>=lim).forEach(x=>{const k=addDays(x.date,-dow(x.date));weeks[k]=(weeks[k]||0)+(x.min||0);});
  const wkBars=Object.keys(weeks).sort().slice(-12).map(k=>({label:lbl(dnum(k)),v:weeks[k]}));
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));
  const pBars=days.map(d=>({label:lbl(dnum(d)).replace(/^\w+ /,''),v:dayTotals(d).p}));
  const exNames=[...new Set(S.workouts.flatMap(x=>(x.exercises||[]).map(e=>e.name)))].sort();
  if(exNames.length&&(!exKey||!exNames.includes(exKey)))exKey=exNames[0];
  const exPts=exKey?S.workouts.filter(x=>dnum(x.date)>=lim).flatMap(x=>(x.exercises||[]).filter(e=>e.name===exKey&&e.kg!=null).map(e=>[dnum(x.date),wOut(e.kg)])):[];
  return`<div class="card"><div class="between"><h2 style="margin:0">Weight trend</h2>${rangeChips()}</div>${lineChart({series:[{pts:w.map(x=>[dnum(x.date),wOut(x.kg)]),c:1,dots:true},{pts:movAvg(weights()).filter(p=>p[0]>=lim).map(p=>[p[0],wOut(p[1])]),c:2}]})}</div>
  <div class="card"><h2>Training minutes per week</h2>${barChart({bars:wkBars})}</div>
  <div class="card"><h2>Protein, last 14 days</h2>${barChart({bars:pBars,target:proteinTarget()})}<div class="hint">Dashed line = your daily target${proteinTarget()?'':' (log a weight to get an automatic one)'}.</div></div>
  ${exNames.length?`<div class="card"><h2>Lift progress</h2><label class="f"><select id="ex-pick">${exNames.map(n=>`<option ${n===exKey?'selected':''}>${esc(n)}</option>`).join('')}</select></label>${lineChart({series:[{pts:exPts,c:3,dots:true}],h:160})}<div class="hint">Weight used per session (${wU()}).</div></div>`:''}
  <div class="card"><h2>Ask Claude about your data</h2><div class="hint">Copy a compact summary and paste it into a chat with Claude (or any assistant) along with your question.</div><button class="full" data-a="coach">Create summary to paste</button></div>`;
}
function coachSummary(){
  const p=S.profile,t=todayStr(),w=weights(),rate=weeklyRate();let s=`FITNESS SUMMARY (as of ${t})\n`;
  s+=`Goal: ${GOALS[p.goal]?GOALS[p.goal].label:p.goal}; age ${p.age||'?'}; height ${p.heightCm?r1(lOut(p.heightCm))+' '+lU():'?'}; equipment: ${EQUIP[p.equipment]||''}${p.program?'; program: '+p.program:''}\n`;
  if(w.length){const l=w[w.length-1],f=w[0];s+=`Weight: ${r1(wOut(l.kg))} ${wU()} on ${l.date} (first logged ${r1(wOut(f.kg))} on ${f.date})${rate!=null?`; trend ${rate>0?'+':''}${r1(wOut(rate))} ${wU()}/week over last 3 weeks`:''}\n`;
   s+='Recent weights: '+w.slice(-10).map(x=>`${x.date.slice(5)} ${r1(wOut(x.kg))}`).join(', ')+'\n';}
  (p.measures||[]).forEach(k=>{const bs=bodySorted().filter(x=>x.m&&x.m[k]!=null);if(bs.length)s+=`${MEAS[k].label}: ${bs.slice(-4).map(x=>`${x.date.slice(5)} ${r1(lOut(x.m[k]))}`).join(', ')} ${lU()}\n`;});
  const d28=addDays(t,-28),ws=S.workouts.filter(x=>x.date>=d28&&x.kind!=='rest');
  s+=`Workouts last 28 days: ${ws.length} sessions, ${sum(ws.map(x=>x.min||0))} min, ${sum(ws.map(x=>x.kcal||0))} kcal burned (device estimate)\n`;
  const lifts={};S.workouts.filter(x=>x.date>=d28).forEach(x=>(x.exercises||[]).forEach(e=>{if(e.kg!=null)lifts[e.name]=Math.max(lifts[e.name]||0,e.kg);}));
  if(Object.keys(lifts).length)s+='Top lifts last 28 days: '+Object.entries(lifts).map(([n,k])=>`${n} ${r1(wOut(k))}${wU()}`).join(', ')+'\n';
  const days=[];for(let i=13;i>=0;i--)days.push(addDays(t,-i));const logged=days.map(d=>dayTotals(d)).filter(x=>x.n);
  if(logged.length)s+=`Food last 14 days (${logged.length} days logged): avg protein ${Math.round(avg(logged.map(x=>x.p)))} g/day${proteinTarget()?` (target ${proteinTarget()})`:''}${logged.some(x=>x.c)?`, avg ${Math.round(avg(logged.filter(x=>x.c).map(x=>x.c)))} kcal/day`:''} (estimates)\n`;
  const lm=S.meals.slice(-6);if(lm.length)s+='Recent meals: '+lm.map(m=>`${m.date.slice(5)} ${m.slot}: ${m.text||''} (${m.p||0}g P)`).join(' | ')+'\n';
  return s;
}

async function shareOrDownload(name,text,type){
  const file=new File([text],name,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true;}catch(e){if(e&&e.name==='AbortError')return false;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true;
}

  delFood:el=>{S.foods.splice(+el.dataset.i,1);save();settingsSheet();},
  coach:()=>{const s=coachSummary();openSheet(`<h3>Summary to paste</h3><textarea id="coach-t" style="min-height:260px;font-size:13px">${esc(s)}</textarea><button class="full" data-a="copyCoach" style="margin-top:8px">Copy</button> <button class="sec full" style="margin-top:8px" data-a="close">Close</button>`);},
  copyCoach:async()=>{const t=$('#coach-t');try{await navigator.clipboard.writeText(t.value);toast('Copied – paste it into your chat');}catch(e){t.select();document.execCommand('copy');toast('Copied');}}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;if(el.tagName==='A')e.preventDefault();const f=A[el.dataset.a];if(f)f(el);});
document.addEventListener('input',e=>{if(e.target.classList&&(e.target.classList.contains('e-p')||e.target.classList.contains('e-c')))syncEst();});
document.addEventListener('change',e=>{if(e.target.id==='ex-pick'){exKey=e.target.value;render();}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!$('#ov'))render();});
render();
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
